# Flink Cluster Configuration
flink.jobmanager.host=localhost
flink.jobmanager.port=28081
flink.parallelism=1

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.topic.input=raw_events
kafka.consumer.group.id=dscl_processor_group

# Elasticsearch Configuration
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http
elasticsearch.index=events_idx

# ClickHouse Configuration (if needed)
clickhouse.host=localhost
clickhouse.port=8123
clickhouse.database=default
clickhouse.username=default

# Pipeline Configuration
checkpointing.interval=5000
batch.size.elasticsearch=500
batch.size.clickhouse=5000
max.inflight.requests=50
max.buffered.requests=10000